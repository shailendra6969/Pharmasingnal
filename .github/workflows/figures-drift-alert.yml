# Weekly alert for the figures-drift guard (.github/workflows/figures-drift.yml).
#
# The drift guard turns red when the committed migration 004 report stops
# matching production — but a red scheduled job is easy to miss. This
# workflow runs weekly, reads the guard's run history via the API, and keeps
# exactly one open issue per ongoing failure:
#
#   latest COMPLETED figures-drift run failed  -> open an issue, or refresh
#       the existing one with a weekly digest comment — how long the drift
#       has persisted, plus the newest run link (never duplicates); every
#       such issue is triaged into a queue — a `severity: high` label (made
#       on demand) plus the repository's assignee — asserted when the issue
#       is created and re-asserted on every refresh. Once that open issue
#       has survived ESCALATE_AFTER_DAYS (28 = four weekly checks) with the
#       guard still red, escalate it — an `escalated` label plus an
#       [ESCALATED] title prefix, applied exactly once (the label is also
#       what stops week five, six … re-escalating)
#   latest completed run was green             -> close the open issue with
#       a note stating how long the drift lasted before it cleared, so the
#       tracker reflects current state; the escalation dies
#       with the issue, so the next failure opens a fresh unprefixed one
#   no completed runs yet (fresh repository)   -> do nothing
#
# Design constraints, pinned by tests/unit/test_workflow_figures_drift_alert.py:
#   - built-in GITHUB_TOKEN only (actions:read + issues:write), never a PAT
#     or repository secret;
#   - no checkout, no dependencies — pure gh/jq on the runner image; GH_REPO
#     names the repository explicitly, because without a checkout gh cannot
#     discover it from a git remote (first real run died on "fatal: not a
#     git repository" until this was set);
#   - never triggered by pull_request — an issues:write token must not be
#     reachable from fork PRs;
#   - escalation rides that same token: label management is part of the
#     issues API surface, so no permission beyond actions:read +
#     issues:write is ever added for it.
name: figures-drift-alert

on:
  schedule:
    # Weekly, Monday 07:43 UTC — deliberately off the hour, like figures-drift.
    - cron: "43 7 * * 1"
  workflow_dispatch:         # manual test runs

permissions:
  actions: read              # read the drift guard's run history
  issues: write              # open / comment / close the alert issue

concurrency:
  group: figures-drift-alert
  cancel-in-progress: false

jobs:
  alert-on-drift-failure:
    name: alert when the figures-drift guard is failing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}   # built-in token only, never a PAT
      GH_REPO: ${{ github.repository }}   # no checkout: tell gh which repo to act on
      DRIFT_WORKFLOW: figures-drift.yml
      ISSUE_MARKER: figures-drift
      # The repository's only assignable user: the assignee is what puts the
      # issue in a person's queue instead of only in the tracker.
      ALERT_ASSIGNEE: shailendra6969
      # Severity of any open drift alert; created on demand (idempotent
      # --force) and re-asserted weekly, so triage edits are restored.
      SEVERITY_LABEL: "severity: high"
      # Four weekly checks: the issue is created on the first failing check
      # and any green week closes it, so its open age IS the run of
      # consecutive weekly failures — 28 days = the fourth.
      ESCALATE_AFTER_DAYS: "28"

    steps:
      - name: Open, refresh, escalate or close the drift alert issue
        run: |
          set -euo pipefail

          TITLE="[${ISSUE_MARKER}] report figures no longer match production"

          # Triage: an alert nobody owns is an alert nobody acts on. The
          # severity label is made on demand (idempotent --force), then the
          # label and the assignee are asserted together on BOTH paths that
          # touch a failing issue — creation and the weekly refresh — so an
          # issue opened before this step existed (or one whose triage was
          # edited by hand) is corrected on the next run.
          triage() {
            gh label create "$SEVERITY_LABEL" --force --color D93F0B \
              --description "committed report no longer matches production"
            gh issue edit "$1" --add-label "$SEVERITY_LABEL" \
              --add-assignee "$ALERT_ASSIGNEE"
          }

          # Escalation: four consecutive weekly failures. The age and
          # createdAt are handed in from the refresh below — the issue was
          # created on the first failing check and any green week closes it,
          # so 28 open days means every weekly check since creation found
          # the guard red. Measured once per run, so the digest comment and
          # this escalation can never report different durations. Label +
          # retitle, once: the label is the visible escalation and doubles
          # as the guard against repeating it, and the marker stays in the
          # title so the dedupe search still finds this issue.
          escalate() {
            issue=$1
            created=$2
            age_days=$3
            if [ "$age_days" -lt "$ESCALATE_AFTER_DAYS" ]; then
              return 0
            fi
            already=$(gh issue view "$issue" --json labels \
              --jq '[.labels[].name] | index("escalated") // empty')
            if [ -n "$already" ]; then
              return 0
            fi
            gh label create escalated --force --color B60205 \
              --description "figures-drift red for 4+ consecutive weekly checks"
            gh issue edit "$issue" --add-label escalated --title "[ESCALATED] ${TITLE}"
            gh issue comment "$issue" --body \
              "Escalated: open since ${created} — ${age_days} days with the guard still red (4+ consecutive weekly failures). Newest run: ${run_url}"
          }

          # Latest COMPLETED run of the guard (in-progress runs are ignored).
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${DRIFT_WORKFLOW}/runs?status=completed&per_page=1")
          conclusion=$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$run_json")

          if [ -z "$conclusion" ]; then
            echo "No completed ${DRIFT_WORKFLOW} runs yet — nothing to alert on."
            exit 0
          fi

          run_url=$(jq -r '.workflow_runs[0].html_url' <<<"$run_json")
          run_date=$(jq -r '.workflow_runs[0].created_at' <<<"$run_json")
          open_issue=$(gh issue list --state open \
            --search "${ISSUE_MARKER} in:title" --json number \
            --jq '.[0].number // empty')

          case "$conclusion" in
            success)
              if [ -n "$open_issue" ]; then
                # The drift is over — say how long it lasted. Same
                # measurement as the digest: the issue's own age, since it
                # opened on the first red check and only a green one lands
                # here, closing it.
                created=$(gh issue view "$open_issue" --json createdAt --jq .createdAt)
                age_days=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
                days="${age_days} days"
                if [ "$age_days" -eq 1 ]; then
                  days="1 day"
                fi
                weeks=$(( age_days / 7 ))
                if [ "$weeks" -eq 1 ]; then
                  span="1 week"
                else
                  span="${weeks} weeks"
                fi
                gh issue close "$open_issue" --comment \
                  "figures-drift is green again (run ${run_date}): ${run_url} — report figures match production. The drift lasted ${days} (${span}) — red without interruption since ${created} until this run."
              fi
              ;;
            failure|timed_out|cancelled)
              body=$(cat <<EOF
          The scheduled figures-drift guard failed (run from ${run_date}): ${run_url}

          The committed migration 004 report no longer matches the figures the production read-only replica serves — or the guard could not reach the replica at all. Read the run log, decide which of the two happened, then either investigate the data drift or regenerate the report with scripts/report_figures.py --write once the movement is confirmed legitimate.

          This issue is maintained automatically: refreshed on each failing weekly check, closed when the guard is green again.
          EOF
              )
              if [ -n "$open_issue" ]; then
                # Weekly digest: how long the drift has persisted. The open
                # issue's own age IS the streak (created on the first
                # failing check, closed by any green one), so measure it
                # once here, say it in the comment, and hand the same
                # numbers to escalate() so the two can never disagree.
                created=$(gh issue view "$open_issue" --json createdAt --jq .createdAt)
                age_days=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))
                days="${age_days} days"
                if [ "$age_days" -eq 1 ]; then
                  days="1 day"
                fi
                weeks=$(( age_days / 7 ))
                if [ "$weeks" -eq 1 ]; then
                  span="1 week"
                else
                  span="${weeks} weeks"
                fi
                digest=$(cat <<EOF
          Still failing as of ${run_date}: ${run_url}
          
          Weekly digest: this drift has persisted ${days} (${span}) — the guard has been red without interruption since ${created}.
          EOF
          )
                gh issue comment "$open_issue" --body "$digest"
                triage "$open_issue"
                escalate "$open_issue" "$created" "$age_days"
              else
                new_issue=$(gh issue create \
                  --title "$TITLE" \
                  --body "$body")
                triage "${new_issue##*/}"
              fi
              ;;
            *)
              echo "Latest run conclusion '${conclusion}' — not alerting."
              ;;
          esac
